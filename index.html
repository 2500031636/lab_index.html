
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <h2>Student Registration Module</h2>
    <form>
        <label>Student Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Student ID:</label>
        <input type="text" id="studentId" required>
        <br><br>

        <button type="button" onclick="registerStudent()">
            Register Student
        </button>
    </form>

    <p id="registrationOutput"></p>

    <hr>

    <h2>Student Results Module</h2>
    <form>
        <label>Student Name:</label>
        <input type="text" id="resultName">
        <br><br>

        <label>Marks:</label>
        <input type="number" id="marks" min="0" max="100">
        <br><br>

        <button type="button" onclick="showResult()">
            Display Result
        </button>
    </form>

    <p id="resultOutput"></p>

    <script>
        function registerStudent() {
            let name = document.getElementById("name").value;
            let id = document.getElementById("studentId").value;

            if (name && id) {
                document.getElementById("registrationOutput").innerHTML =
                    "Student Registered: " + name + " (ID: " + id + ")";
            }
        }

        function showResult() {
            let name = document.getElementById("resultName").value;
            let marks = document.getElementById("marks").value;

            if (name !== "" && marks !== "" &&
                Number(marks) >= 0 && Number(marks) <= 100) {
                let status = Number(marks) >= 35 ? "Pass" : "Fail";

                document.getElementById("resultOutput").innerHTML =
                    name + "'s Result: " + marks + "/100 - " + status;
            } else {
                document.getElementById("resultOutput").innerHTML =
                    "Enter a valid name and marks between 0 and 100.";
            }
        }
    </script>

</body>
</html>
